<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Screen</title>
    <meta name="description" content="A clean, distraction-free pure black screen with auto-hiding cursor and fullscreen mode." />
    <meta property="og:title" content="Black Screen" />
    <meta property="og:description" content="A clean, distraction-free pure black screen with auto-hiding cursor and fullscreen mode." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      /* Remove scrollbars everywhere across all browsers */
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body class="bg-black text-neutral-400 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
